version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binance_analysis_backend
    restart: unless-stopped
    ports:
      - "8050:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: binance_analysis_frontend
    restart: unless-stopped
    ports:
      - "3050:80"
    depends_on:
      - backend
